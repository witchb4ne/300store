<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #fff;
        }

        .login-box {
            max-width: 400px;
            margin: 80px auto;
            padding: 35px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-dark {
            width: 100%;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">3Hunna Store</a>
        </div>
    </nav>

    <div class="container">
        <div class = "login-box">
            <h2>ВХОД</h2>

            <form>
                <div class="form-group">
                    <label>Электронная почта</label>
                    <input type="email" class="form-control" placeholder="Введите почту" required> 
                </div>
                <div class="form-group">
                    <label>Введите пароль</label>
                    <input type="password" class="form-control" placeholder="Введите пароль" required> 
                </div>
                <button type="submit" class="btn btn-dark">
                    Войти
                </button>
            </form>
        </div>
    </div>
    <footer class="bg-light text-center text-muted py-3 mt-4">
        <div class="container">
            &copy; 2026 3Hunna Store
        </div>
    </footer>
</body>
</html>
